# Builds the jar and the standalone app of FlappyBirdAI.
# Commands used here are described in BUILD_INSTRUCTIONS.txt.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new run on the same branch cancels the old one still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Standalone app with Java included, one per operating system and CPU.
  # jpackage cannot build for another OS, so each one runs on its own runner.
  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failed job does not stop the others
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,  os: windows-latest }
          - { name: linux-x64,    os: ubuntu-latest }
          - { name: linux-arm64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,  os: macos-latest }
          - { name: macos-intel,  os: macos-15-intel }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Builds the fat jar, copies it to target/jpackage-input, then runs jpackage.
      # Result: target/dist
      - name: Build jar and app image
        shell: bash
        run: mvn --batch-mode clean package jpackage:jpackage

      # upload-artifact does not keep file permissions, so the app is archived first
      - name: Archive app (Windows, zip)
        if: runner.os == 'Windows'
        shell: bash
        run: 7z a "FlappyBirdAI-${{ matrix.name }}.zip" ./target/dist/*

      - name: Archive app (Linux/macOS, tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target/dist -czf "FlappyBirdAI-${{ matrix.name }}.tar.gz" .

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: FlappyBirdAI-${{ matrix.name }}
          path: FlappyBirdAI-${{ matrix.name }}.*
          if-no-files-found: error

  # Fat jar (Java 25 must be installed to run it), one per operating system and CPU.
  jar:
    name: Jar (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform = JavaFX variant (-Djavafx.platform), name = text added to the jar name
          - { name: windows-x64, platform: win }
          - { name: linux-x64,   platform: linux }
          - { name: linux-arm64, platform: linux-aarch64 }
          - { name: macos-intel, platform: mac }
          - { name: macos-arm64, platform: mac-aarch64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build fat jar for ${{ matrix.name }}
        run: mvn --batch-mode clean package "-Djavafx.platform=${{ matrix.platform }}" "-Djar.suffix=-${{ matrix.name }}"

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: FlappyBirdAI-jar-${{ matrix.name }}
          path: target/FlappyBirdAI-*.jar
          if-no-files-found: error