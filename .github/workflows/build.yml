name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Native app (Java included) for each operating system
  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, execution: win }
          - { name: linux,   os: ubuntu-latest,  execution: linux }
          - { name: macos,   os: macos-latest,   execution: mac }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Builds the fat jar, copies it to target/jpackage-input, then runs jpackage.
      # The result is in target/dist
      - name: Build jar and app image
        shell: bash
        run: mvn --batch-mode clean package jpackage:jpackage@${{ matrix.execution }}

      # upload-artifact does not keep file permissions, so the app is archived first
      - name: Archive app (Windows, zip)
        if: runner.os == 'Windows'
        shell: bash
        run: 7z a "FlappyBirdAI-${{ matrix.name }}.zip" ./target/dist/*

      - name: Archive app (Linux/macOS, tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target/dist -czf "FlappyBirdAI-${{ matrix.name }}.tar.gz" .

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBirdAI-${{ matrix.name }}
          path: FlappyBirdAI-${{ matrix.name }}.*
          if-no-files-found: error

  # Fat jar (Java must be installed to run it): one jar per operating system / CPU.
  # The jars are only zip files, so all of them can be built on the same machine.
  jar:
    name: Jar (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [win, linux, linux-aarch64, mac, mac-aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build fat jar for ${{ matrix.platform }}
        run: mvn --batch-mode clean package "-Djavafx.platform=${{ matrix.platform }}" "-Djar.suffix=-${{ matrix.platform }}"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBirdAI-jar-${{ matrix.platform }}
          path: target/FlappyBirdAI-*.jar
          if-no-files-found: error
