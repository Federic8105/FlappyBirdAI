# Dependabot configuration.
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maven: dependencies and plugins declared in pom.xml
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Minor and patch updates together in one pull request.
      # Major updates are not in the group: each one gets its own pull request.
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions: actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Same rule as above
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"